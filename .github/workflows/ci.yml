name: 'CI'

on:
  push:
    branches: [ latest, next ]

  pull_request:
    branches: [ latest, next ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: build
          path: dist

  lint:
    name: 'Lint'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Lint
        continue-on-error: true
        run: yarn lint -f @microsoft/sarif -o eslint-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3.30.9
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: junit-report.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: 'E2E tests'
    runs-on: ${{ matrix.os }}
    needs: [ build ]

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'windows-latest'
          - 'macos-latest'
        node:
          - 20
          - 22
          - 24
        packageManager:
          - npm
          - yarn

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node }}.x
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build
          path: dist

      - name: Setup git
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Run E2E tests
        run: yarn e2e -t ${{ matrix.packageManager }} --no-file-parallelism
        env:
          SENTRY_ENVIRONMENT: testing

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: junit-report.xml
          flags: e2e,${{ matrix.os }},node-${{ matrix.node }},${{ matrix.packageManager }}
          token: ${{ secrets.CODECOV_TOKEN }}

  complete:
    if: ${{ github.event_name == 'pull_request' && always() }}

    name: 'Complete'
    runs-on: ubuntu-latest
    needs: [ lint, tests, e2e ]

    permissions:
      contents: read

    steps:
      - name: Failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Success
        run: echo 'You are soooo curious ;)'

  publish:
    if: ${{ github.event_name == 'push' }}
    name: 'Publish to npm'

    runs-on: ubuntu-latest
    environment: npm
    needs: [ lint, tests, e2e ]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          name: build
          path: dist

      - name: Publish
        run: yarn npm publish --access public --tag ${{ github.ref_name }} --tolerate-republish --provenance
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    if: ${{ github.event_name == 'push' }}

    name: 'Publish release'
    runs-on: ubuntu-latest
    needs: [ publish ]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Read package.json
        id: info
        run: echo "version=$(jq -r ".version" package.json)" >> $GITHUB_OUTPUT

      - name: Tag version
        id: tag
        run: |
          echo "::group::git fetch --tags"
          
          git fetch --tags
          
          echo "::endgroup::"
          
          if [[ $(git tag -l $VERSION) == $VERSION ]]; then
            echo "::notice::git tag $VERSION already exists"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
          
            git tag $VERSION
            git push --tags
          
            echo "notes=true" >> $GITHUB_OUTPUT
          fi
        env:
          VERSION: v${{ steps.info.outputs.version }}

      - name: Release notes
        if: ${{ steps.tag.outputs.notes }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.info.outputs.version }}
          tag_name: v${{ steps.info.outputs.version }}
          generate_release_notes: true
