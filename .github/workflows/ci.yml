name: 'CI'

on:
  push:
    branches: [ latest, next ]

  pull_request:
    branches: [ latest, next ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.x

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          path: dist

  lint:
    name: 'Lint'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.x

      - name: Install
        run: yarn install --immutable

      - name: Lint
        continue-on-error: true
        run: yarn lint -f @microsoft/sarif -o eslint-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4.35.1
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.x

      - name: Install
        run: yarn install --immutable

      - name: Typecheck tests
        run: yarn test:types

      - name: Run tests
        run: yarn test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: unit
          report_type: coverage
          use_oidc: true

      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: junit-report.xml
          flags: unit
          report_type: test_results
          use_oidc: true

  e2e:
    name: 'E2E tests'
    runs-on: ${{ matrix.os }}
    needs: [ build, tests ]

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'windows-latest'
          - 'macos-latest'
        node:
          - 20
          - 22
          - 24

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node }}.x
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Setup git
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Run E2E tests
        run: yarn e2e --no-file-parallelism --retry 3
        env:
          SENTRY_ENVIRONMENT: testing

      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: junit-report.xml
          flags: e2e,${{ matrix.os }},node-${{ matrix.node }}
          report_type: test_results
          use_oidc: true

  complete:
    if: ${{ github.event_name == 'pull_request' && always() }}

    name: 'Complete'
    runs-on: ubuntu-latest
    needs: [ build, lint, tests, e2e ]

    permissions:
      contents: read

    steps:
      - name: Failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Success
        run: echo 'You are soooo curious ;)'

  publish:
    if: ${{ github.event_name == 'push' }}
    name: 'Publish to npm'

    runs-on: ubuntu-latest
    environment: npm
    needs: [ lint, tests, e2e ]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build
          path: dist

      - name: Publish
        # language=Bash
        run: |
          name=$(jq -j ".name" package.json)
          version=$(npm view $name@${{ github.ref_name }} version)
          
          if [[ "$version" == "$(jq -j ".version" package.json)" ]]; then
            echo "::notice::$version already exists in npm registry"
          else
            npm publish --access public --tag ${{ github.ref_name }} --provenance
          fi

  release:
    if: ${{ github.event_name == 'push' }}

    name: 'Publish release'
    runs-on: ubuntu-latest
    needs: [ publish ]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Read package.json
        id: info
        # language=Bash
        run: |
          version=$(jq -j ".version" package.json)
          echo "version=$version" >> $GITHUB_OUTPUT
          
          if [[ $version =~ "^[0-9]+\.[0-9]+\.[0-9]-[a-zA-Z]+\.[0-9]+" ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Tag version
        id: tag
        # language=Bash
        run: |
          echo "::group::git fetch --tags"
          
          git fetch --tags
          
          echo "::endgroup::"
          
          if [[ $(git tag -l $VERSION) == $VERSION ]]; then
            echo "::notice::git tag $VERSION already exists"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
          
            git tag $VERSION
            git push --tags
          
            echo "notes=true" >> $GITHUB_OUTPUT
          fi
        env:
          VERSION: v${{ steps.info.outputs.version }}

      - name: Release notes
        if: ${{ steps.tag.outputs.notes }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.info.outputs.version }}
          tag_name: v${{ steps.info.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.info.outputs.prerelease }}

      - name: Finalize Sentry Release
        if: ${{ steps.tag.outputs.notes }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: 'jill@${{ steps.info.outputs.version }}'
          environment: production
          finalize: true
